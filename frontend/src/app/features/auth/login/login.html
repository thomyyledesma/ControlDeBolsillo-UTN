<div class="auth-layout">
  <aside class="auth-marca">
    <div class="auth-marca-logo">Plata clara</div>
    <h2 class="auth-marca-titular">
      Tu dinero,<br />
      <em>sin sorpresas.</em>
    </h2>
    <p class="auth-marca-pie">Cuentas, gastos y metas en un solo lugar.</p>
  </aside>

  <main class="auth-form-panel">
    <form class="auth-form" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="auth-form-sub">Bienvenido de vuelta.</p>

      @if (error(); as mensaje) {
        <div class="alerta-error" role="alert">{{ mensaje }}</div>
      }

      <div class="campo">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="tu@email.com"
          formControlName="email"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••"
          formControlName="password"
        />
      </div>

      <button type="submit" class="btn btn-primario" [disabled]="enviando()">
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>

      <p class="auth-form-link">
        ¿No tenés cuenta? <a routerLink="/register">Crear una</a>
      </p>
    </form>
  </main>
</div>
